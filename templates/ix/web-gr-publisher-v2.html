<!-- templates/ix/web-gr-publisher-v2.html -->
<!-- v2 = web-gr-publisher-v1 brought level with email-gr-publisher v4 (106 Gap Interview S3, 18 Oct 2026; closure S2 D6, D7).
     - Opens with the title's salutation line (greetingSalutation), every issue, in the slot v1 gave greetingTitle; the Greeting Title is the masthead line (web-shell issueTitle) and is not repeated here.
     - The gold dotted rule, the publisher's headshot and the signature, as the email card has them. Signature prints ctx.publisherPerson (the person), ", Publisher" typed as the email card types it (HC-P-GR4-1).
     - Long-form body when present, short greeting as the fallback, as before.
     Needs web-blocks-v66.css (nlw-gr-dots, nlw-gr-row, nlw-gr-head, nlw-gr-text, nlw-gr-sign). Colours are shell variables, not WLN literals. -->
<div class="nlw-gr">
  <div class="nlw-gr-dots" aria-hidden="true"><span></span></div>
  <div class="nlw-gr-row">
    {{#ctx.publisherHeadshot}}<img class="nlw-gr-head" src="{{ctx.publisherHeadshot}}" alt="{{ctx.publisherPerson}}" loading="lazy">{{/ctx.publisherHeadshot}}
    <div class="nlw-gr-text">
      <h2 class="nlw-gr-title">{{greetingSalutation}}</h2>
      <div class="nlw-gr-body">
        {{#greetingBody}}<p>{{greetingBody}}</p>{{/greetingBody}}
        {{^greetingBody}}<p><em>{{greetingSupershort}}</em></p>{{/greetingBody}}
      </div>
      <p class="nlw-gr-sign">{{ctx.publisherPerson}}, Publisher</p>
    </div>
  </div>
</div>

<!-- templates/ix/email-ev-cards-v1.html -->
<!-- INBXIFY email block · EV · multi-event cards. Renders 2..5 events. -->
<!-- Table-based, inline styles, no external CSS, no media queries. -->
<!-- No template syntax inside comments. The Worker parses comments. -->

<tr><td style="padding:0 20px 16px;">
  <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">

    {{#if f_evArt}}
    <tr><td style="padding:0 0 0;">
      <img src="{{f_evArt}}" width="560" alt="{{f_evHeading}}" style="display:block;width:100%;height:auto;border-radius:12px 12px 0 0;" />
    </td></tr>
    {{/if}}

    <tr><td style="background-color:#ffffff;border:1px solid #e8e4d8;border-radius:0 0 12px 12px;padding:0;">
      <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">

        {{#each cards}}
        <tr><td style="padding:12px 14px 0;">
          <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="border:1px solid #e8e4d8;border-radius:6px;">

            <tr><td style="background-color:#1A3A3A;padding:7px 12px;border-radius:5px 5px 0 0;">
              <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                <tr>
                  <td style="font-family:Georgia,serif;font-size:15px;font-weight:700;color:#ffffff;white-space:nowrap;">{{dtDay}}</td>
                  <td style="font-family:Arial,Helvetica,sans-serif;font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#C4A35A;padding-left:6px;white-space:nowrap;">{{dtMonth}}</td>
                  <td align="right" style="font-family:Arial,Helvetica,sans-serif;font-size:9px;color:rgba(255,255,255,0.55);white-space:nowrap;">{{dtDow}} &middot; {{dtTime}}</td>
                </tr>
              </table>
            </td></tr>

            <tr><td style="padding:10px 12px 12px;">
              <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                <tr>

                  {{#if x_hasPhoto}}
                  <td width="96" valign="top" style="padding-right:12px;">
                    <a href="{{link}}" target="_blank" style="display:block;">
                      <img src="{{photo}}" width="96" alt="{{title}}" style="display:block;width:96px;height:auto;border-radius:4px;" />
                    </a>
                  </td>
                  {{/if}}

                  <td valign="top">
                    <a href="{{link}}" target="_blank" style="font-family:Georgia,serif;font-size:16px;font-weight:700;color:#1A3A3A;text-decoration:none;line-height:1.25;">{{title}}</a>
                    <p style="margin:5px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#8a8a7a;">{{venue}}</p>
                    {{#if x_hasTeaser}}
                    <p style="margin:7px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.5;color:#4a5a4a;">{{teaser}}</p>
                    {{/if}}
                    <p style="margin:9px 0 0;">
                      <a href="{{link}}" target="_blank" style="font-family:Arial,Helvetica,sans-serif;font-size:10px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;color:#C4A35A;text-decoration:none;">Get Details &rarr;</a>
                    </p>
                  </td>

                </tr>
              </table>
            </td></tr>

          </table>
        </td></tr>
        {{/each}}

        <tr><td style="padding:0 14px 14px;"></td></tr>

        {{#if x_hasSponsor}}
        <tr><td style="padding:0 16px 16px;" align="center">
          <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
            <tr><td style="height:1px;background-color:#e0ddd0;font-size:1px;line-height:1px;">&nbsp;</td></tr>
            <tr><td style="padding:8px 0 0;" align="right">
              <span style="font-family:Arial,Helvetica,sans-serif;font-size:10px;color:#999999;letter-spacing:1px;text-transform:uppercase;">Presented by {{f_sponsorName}}</span>
            </td></tr>
          </table>
          {{#if f_sponsorAd}}
          <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="margin-top:10px;">
            <tr><td align="center">
              <img src="{{f_sponsorAd}}" width="500" alt="{{f_sponsorName}}" style="display:block;width:100%;height:auto;border-radius:4px;" />
            </td></tr>
          </table>
          {{/if}}
        </td></tr>
        {{/if}}

      </table>
    </td></tr>

  </table>
</td></tr>

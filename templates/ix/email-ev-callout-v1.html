<!-- templates/ix/email-ev-callout-v1.html -->
<!--
  EV Callout - house block, added deliberately.  600px shell.

  Nothing here is clickable but the button. The teaser list is meant to
  read as a sample, not an answer: dates and titles only, no venue, no
  time, no description. If it looked complete the reader would have no
  reason to click through.

  Reversed to solid teal so it reads as house furniture rather than an
  event listing.

  The closing line is a phrase rather than a count. A count would be
  operator-typed and would drift.

  Tokens: eyebrow headline closingLine ctaLink ctaText
  Cards:  dtShort title
-->
<tr>
<td style="padding:0 0 18px;">
<table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%"
       style="background-color:#1a3a3a;">

  <tr>
    <td style="padding:24px 26px 8px;" class="mobile-padding">
      {{#eyebrow}}
      <p style="margin:0;font-family:'Jost','Avenir Next',Avenir,'Segoe UI',Arial,sans-serif;
                font-size:8px;font-weight:700;letter-spacing:3px;text-transform:uppercase;
                color:#c4a35a;">{{eyebrow}}</p>
      {{/eyebrow}}
      <p style="margin:7px 0 0;font-family:'Playfair Display','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
                font-size:27px;font-weight:600;color:#f4f0e4;line-height:1.18;">{{&headline}}</p>
    </td>
  </tr>

  <tr>
    <td style="padding:14px 26px 4px;" class="mobile-padding">
      <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
        {{#each cards}}
        <tr>
          <td style="padding:0 0 9px;">
            <span style="font-family:'Jost','Avenir Next',Avenir,'Segoe UI',Arial,sans-serif;
                         font-size:10px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;
                         color:#c4a35a;">{{.dtShort}}&nbsp;&nbsp;</span>
            <span style="font-family:'Lora','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
                         font-size:15px;color:#dfe6e4;">{{.title}}</span>
          </td>
        </tr>
        {{/each}}
      </table>
    </td>
  </tr>

  {{#closingLine}}
  <tr>
    <td style="padding:2px 26px 0;" class="mobile-padding">
      <p style="margin:0;font-family:'Lora','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
                font-style:italic;font-size:14px;color:#8fa5a2;">{{closingLine}}</p>
    </td>
  </tr>
  {{/closingLine}}

  <tr>
    <td align="center" style="padding:20px 26px 26px;" class="mobile-padding">
      <a href="{{&ctaLink}}" target="_blank"
         style="display:inline-block;background-color:#c4a35a;color:#142e2e;
                font-family:'Jost','Avenir Next',Avenir,'Segoe UI',Arial,sans-serif;
                font-size:10px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;
                padding:11px 30px;border-radius:18px;text-decoration:none;">{{ctaText}} &rarr;</a>
    </td>
  </tr>

</table>
</td>
</tr>

<!-- templates/ix/email-gr-publisher-v1.html -->
<!--
  GR - Publisher greeting.  600px shell.
  Ported from WLN-118B "SECTION 2b: PUBLISHER WELCOME".

  Teal strip: gold dot / hairline / gold dot rule, then a circular
  headshot beside an italic supershort line and the publisher credit.

  Changes from the live version:
    - font stacks match the rest of the system
    - the long-form greeting paragraph renders when present; the
      supershort line is the default
    - headshot and title fall back to context so a title with no
      publisher photo still renders cleanly

  Tokens: greetingSupershort greetingTitle greetingBody
          ctx.publisherHeadshot ctx.publisherName
  Flags:  (none - self-gating on content)
-->
<tr>
<td style="background-color:#0d1f1f;padding:0;">
<table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%"
       style="background-color:#1a3a3a;">

  <!-- gold dot rule -->
  <tr>
    <td style="padding:12px 22px 0;" class="mobile-padding">
      <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
        <tr>
          <td width="6" style="width:6px;height:6px;border-radius:50%;background:#d4a04a;font-size:0;line-height:0;">&#8203;</td>
          <td height="1" style="height:1px;line-height:1px;font-size:0;background:#2a5a5a;mso-line-height-rule:exactly;">&#8203;</td>
          <td width="6" style="width:6px;height:6px;border-radius:50%;background:#d4a04a;font-size:0;line-height:0;">&#8203;</td>
        </tr>
      </table>
    </td>
  </tr>

  <tr>
    <td style="padding:14px 22px 16px;" class="mobile-padding">
      <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
        <tr>
          <td width="50" valign="top" style="width:50px;">
            <img src="{{ctx.publisherHeadshot}}" width="50" height="50" alt="{{ctx.publisherName}}"
                 style="display:block;width:50px;height:50px;border-radius:50%;
                        border:2px solid #d4a04a;">
          </td>
          <td valign="middle" style="padding-left:18px;">

            {{#greetingTitle}}
            <p style="margin:0 0 6px;font-family:'Playfair Display','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
                      font-size:17px;font-weight:600;color:#f4f0e4;line-height:1.25;">{{greetingTitle}}</p>
            {{/greetingTitle}}

            {{#greetingBody}}
            <p style="margin:0;font-family:'Lora','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
                      font-size:14px;line-height:1.65;color:#dfe7e5;">{{greetingBody}}</p>
            {{/greetingBody}}

            {{^greetingBody}}
            <p style="margin:0;font-family:'Lora','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
                      font-size:14px;font-style:italic;color:#e2dfca;line-height:1.55;">{{greetingSupershort}}</p>
            {{/greetingBody}}

            <p style="margin:8px 0 0;font-family:'Jost','Avenir Next',Avenir,'Segoe UI',Arial,sans-serif;
                      font-size:10px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;
                      color:#8a9a8a;">{{ctx.publisherName}}, Publisher</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>

</table>
</td>
</tr>

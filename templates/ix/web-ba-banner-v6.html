<!-- templates/ix/web-ba-banner-v6.html -->
<!-- web-ba-banner-v6 = web-ba-banner-v5.html with its header comment repaired (22 Nov 2026). When v5 was made, its
     own note replaced the first line of v4's note, which held v4's opening comment mark, so the rest of v4's note
     sat outside any comment and printed as visible text above every banner (found on WLN-124B). No markup changed. -->
<!-- web-ba-banner-v5 = web-ba-banner-v4.html (Performance Report S2, 16 Nov 2026): the ad now says which ad, which advertiser and which spot it is, for the site collector (ix-perf-site v1.0.0): data-ixp-ad, data-ixp-adv, data-ixp-slot, data-ixp-shape. Needs ix-issue-data v1.0.187 for the values; with an older Worker the attributes print empty and nothing else changes. Nothing else changed. -->
<!-- web-ba-banner-v4 = web-ba-banner-v3.html with pin-in-place:
     A banner block pinned on Layout (NL-BLOCKS pin-in-place, ix-issue-data v1.0.173 x_pinned) carries
     data-ix-pin="1", and ix-ba-rotate v1.0.2 leaves it in its spot, as it leaves the Lead. Nothing else changed. -->
<!-- templates/ix/web-ba-banner-v3.html -->
<!-- v3 = web-ba-banner-v2.html with its label set per placement (D179). In
     order: this row's NL-BLOCKS block-text (f_blockText), the labels map
     (ctx.lblPartners: issue, then title), then "Featured local partners".
     v2 read an adLabel field 206 never sent, so it always printed the typed
     "Featured Local Partner". A group of ads shows one label instead, set by
     newsletter-render v1.11.0 in the same order. Nothing else changed. -->
<!-- WS-I Session 5 · BA banner. The sold flag gates the whole block: an unsold
     slot renders nothing at all — no mat, no label, no gap (D10).
     When the Worker detects consecutive BA blocks it wraps the run in
     .nlw-ba-group and emits one .nlw-ba-group-label ahead of them; the
     per-ad labels below are suppressed by CSS in that case. -->
{{#sold}}
<div class="nlw-ba" data-ixp-slot="{{slot}}"{{#pinned}} data-ix-pin="1"{{/pinned}}>
  <div class="nlw-ba-label">{{#blockText}}{{blockText}}{{/blockText}}{{^blockText}}{{#ctx.lblPartners}}{{ctx.lblPartners}}{{/ctx.lblPartners}}{{^ctx.lblPartners}}Featured local partners{{/ctx.lblPartners}}{{/blockText}}</div>
  <a href="{{adLink}}" target="_blank" rel="noopener" data-ixp-ad="{{adId}}" data-ixp-adv="{{customerId}}" data-ixp-shape="banner"><img src="{{adImage}}" alt="{{adName}}" loading="lazy"></a>
</div>
{{/sold}}

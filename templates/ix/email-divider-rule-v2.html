<!-- templates/ix/email-divider-rule-v2.html -->
<!--
  v2: every colour reads a token (Design Port S2).

  Divider - a rule between blocks.  600px shell.

  v0.4 used a 2px gradient (#c48a3a -> #eac76e -> #c48a3a). Gradients
  do not render in Outlook, which falls back to no background at all,
  so the rule vanished there. Flat gold renders everywhere.

  mso-line-height-rule:exactly stops Outlook inflating a 1px row to
  the font's line height.

  Tokens: none
-->
<tr>
  <td style="background-color:{{ctx.page-bg}};padding:18px 26px;">
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
      <tr>
        <td height="1" style="height:1px;line-height:1px;font-size:0;background-color:{{ctx.accent-soft}};mso-line-height-rule:exactly;">&nbsp;</td>
      </tr>
    </table>
  </td>
</tr>

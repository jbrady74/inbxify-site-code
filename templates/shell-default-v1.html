<!-- shell-default-v1.html -->
<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="x-apple-disable-message-reformatting">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Lora:ital@0;1&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>{{issueTitle}}</title>
<!--[if mso]>
<noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript>
<![endif]-->
<style type="text/css">
body,table,td,a{-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%}
table,td{mso-table-lspace:0pt;mso-table-rspace:0pt}
img{-ms-interpolation-mode:bicubic;border:0;height:auto;line-height:100%;outline:none;text-decoration:none}
body{height:100%!important;margin:0!important;padding:0!important;width:100%!important;background-color:#142e2e}
a{color:#142e2e;text-decoration:none}
@media screen and (max-width:720px){
.wrapper{width:100%!important}
.mobile-padding{padding-left:12px!important;padding-right:12px!important}
.mobile-stack{display:block!important;width:100%!important;padding-right:0!important;padding-bottom:14px!important}
.mobile-center{text-align:center!important}
.mobile-full{width:100%!important;height:auto!important}
.mobile-hide{display:none!important}
.outer-padding{padding-left:4px!important;padding-right:4px!important}
.fa-title{font-size:26px!important;line-height:32px!important}
.fa-excerpt{font-size:16px!important;line-height:26px!important}
}
</style>
</head>
<body style="margin:0;padding:0;background-color:#142e2e;">

<div style="display:none;max-height:0;overflow:hidden;">
{{issueTitle}}
&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;
</div>

<table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color:#142e2e;">
<tr>
<td align="center" style="padding:10px 0;" class="outer-padding">

<!-- MAIN CONTAINER — 700px -->
<table role="presentation" cellspacing="0" cellpadding="0" border="0" width="700" class="wrapper" style="max-width:700px;background-color:#142e2e;">

<!-- ISSUE BAR -->
<tr>
<td style="background-color:#e2dfca;padding:8px 4px 0;">
<table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
<tr>
  <td style="background-color:{{#themeAccent}}{{themeAccent}}{{/themeAccent}}{{^themeAccent}}#f4a127{{/themeAccent}};padding:14px 24px;" class="mobile-padding">
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
      <tr>
        <td width="80" valign="middle" style="text-align:left;">
          <span style="font-family:'Jost',Arial,sans-serif;font-size:10px;font-weight:600;letter-spacing:3px;color:#142e2e;opacity:0.55;">ISSUE</span><br>
          <span style="font-family:'Playfair Display',Georgia,serif;font-size:24px;font-weight:700;color:#142e2e;">{{issueNo}}</span>
        </td>
        <td valign="middle" style="text-align:center;padding:0 14px;">
          <h1 style="margin:0;font-family:'Playfair Display',Georgia,serif;font-size:25px;font-weight:600;font-style:italic;color:#142e2e;line-height:1.2;">{{issueTitle}}</h1>
        </td>
        <td width="110" valign="middle" style="text-align:right;">
          <span style="font-family:'Jost',Arial,sans-serif;font-size:11px;font-weight:600;letter-spacing:2px;color:#142e2e;opacity:0.55;">{{publishDate}}</span>
        </td>
      </tr>
    </table>
  </td>
</tr>

<!-- MASTHEAD -->
<tr>
  <td style="background-color:#142e2e;">
    {{#themeMasthead}}
    <img src="{{themeMasthead}}" alt="" width="700" style="display:block;width:100%;height:auto;">
    {{/themeMasthead}}
    {{^themeMasthead}}
    <img src="{{masthead}}" alt="{{titleName}}" width="700" style="display:block;width:100%;height:auto;">
    {{/themeMasthead}}
  </td>
</tr>
</table>
</td>
</tr>

<!-- CONTENT -->
<tr>
<td style="background-color:#e2dfca;padding:8px 4px 10px;border-radius:0 0 12px 12px;">
<table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">

{{BLOCKS}}

<!-- FOOTER -->
<tr>
<td style="background-color:#cc5500;padding:24px 20px;text-align:center;" class="mobile-padding">
  <p style="margin:0 0 6px;font-family:'Playfair Display',Georgia,serif;font-size:17px;font-weight:600;color:#ffffff;">{{titleName}}</p>
  <p style="margin:0 0 4px;font-family:'Jost',Arial,sans-serif;font-size:12px;color:#ffffff;">Published by <strong>{{publisherName}}</strong></p>
  <p style="margin:0;font-family:'Jost',Arial,sans-serif;font-size:10px;color:#ffffff;opacity:0.75;">&copy; 2026 {{publisherName}}. All Rights Reserved.</p>
</td>
</tr>

</table>
</td>
</tr>

</table>
</td>
</tr>
</table>

</body>
</html>

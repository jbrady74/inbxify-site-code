<!-- WLN's ink and accent are set here, so the platform's neutral values never show on WLN. -->
<!-- Same values as WLN's email shell, so "WLN's teal" is one fact on both surfaces. -->
<!-- WLN uses the platform type scale: no ix-scale-* class and no type tokens here. The shell holds brand, not proportions. -->
<!-- Standing rule: shell changes ALWAYS bump the filename; in-place edit plus purge is dead. -->
<!-- Page chrome: from v28 the masthead is MNA's (D106). Webflow keeps the navbar; web-blocks-v42 colours it from the values below, on MNA pages only (D111). Footer, contact strip and subscribe are still Webflow's until their Design Pass 2 steps. -->
<div class="ix-nl">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jbrady74/inbxify-site-code@main/web-blocks-v56.css">
  <style>
    /* WLN's values on the newsletter. Main and Accent come from TITLES via
       Site Chrome's colour line; the typed values are the fallback. */
    .ix-nl{
      /* WLN · Wyckoff Living NOW — title brand */
      --nl-ink:var(--ix-t-main, #142e2e);
      --nl-ink-deep:color-mix(in srgb, var(--nl-ink), #000 35%);
      --nl-accent:var(--ix-t-accent, #f4a127);
      --nl-font-display:'Fraunces',Georgia,serif;
      --nl-font-ui:'Jost','Avenir Next',Avenir,'Segoe UI',Arial,sans-serif;
      --nl-bar-bg:var(--nl-accent);
      --nl-bar-ink:var(--nl-ink);
      --nl-bar-font:'Playfair Display',Georgia,serif;
      --nl-bar-label-font:'Jost','DM Sans',Arial,sans-serif;
      --nl-signoff-border:#d4a04a;
      --nl-signoff-font:'Playfair Display',Georgia,serif;
      --nl-signoff-ink:#444444;
      --nl-ev-franchise-h:220px;
      --nl-ev-chip-bg:var(--nl-accent);
      --nl-ev-chip-ink:var(--nl-ink);
      --nl-ev-chip-mo-color:var(--nl-ink);
      /* Highlight: TITLES via Site Chrome; WLN's salmon as the fallback.
         A fill colour. Text in it uses --nl-highlight-ink (the stylesheet). */
      --nl-highlight:var(--ix-t-highlight, #EC7259);
      /* flag pill: white on the deeper salmon (v41) */
      --nl-flag-bg:var(--nl-highlight-ink);
      --nl-flag-ink:#FFFFFF;
      --nl-sp-ink:var(--nl-ink);
      --nl-ev-bg:#e5f2f6;
      /* One brand orange. Change it here and every use follows. */
      --nl-wln-orange:#ff4400;
      /* Theme title is the frame's anchor: ink carries it, and the accent
         word inside takes the orange. Orange on the whole line shouts. */
      --nl-txa-kicker-color:var(--nl-ink);
      --nl-txa-kicker-accent:var(--nl-wln-orange);
      --nl-txa-eyebrow-color:#A35F12;
      --nl-txa-visit-rule:var(--nl-wln-orange);
      --nl-txa-art-h:180px;
      --nl-txa-name-font:'Spectral',Georgia,serif;
      --nl-txa-meta-color:#A35F12;
    }
  </style>
  <div class="nlw-issuebar nlw-issuebar--seal">
    <span class="nlw-ib-ghost" aria-hidden="true">{{issueDateNumeric}}</span>
    <span class="nlw-ib-seal"><span class="nlw-ib-no">No.</span><span class="nlw-ib-num">{{issueNo}}</span></span>
    <div class="nlw-ib-text">
      <h1 class="nlw-ib-headline">{{issueTitle}}</h1>
      <div class="nlw-ib-date">{{publishDate}}</div>
    </div>
  </div>
  {{BLOCKS}}
  <div class="nlw-signoff nlw-signoff--card">
    <p class="nlw-so-note">{{#closingNote}}{{closingNote}}{{/closingNote}}{{^closingNote}}Thanks for reading. See you next week!{{/closingNote}}</p>
    <hr class="nlw-so-rule">
    <div class="nlw-so-who">
      {{#publisherHeadshot}}<img class="nlw-so-head" src="{{publisherHeadshot}}" alt="{{publisherPerson}}" loading="lazy">{{/publisherHeadshot}}
      <div><span class="nlw-so-name">{{publisherPerson}}</span><span class="nlw-so-role">Publisher, {{titleName}}</span></div>
    </div>
  </div>
</div>

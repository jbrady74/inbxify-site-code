<!-- templates/bnm-wln/web-shell-v8.html · WS-I web shell v8 — v7 repointed from the v5 stylesheet to web-blocks-v6.css, which adds the EV block rules (Events Display Engine, Session 4). No other change. Standing rule: shell changes ALWAYS bump the filename; in-place edit plus purge is dead. -->
<!-- v5 = v4 linking web-blocks-v5 + THE WLN BRAND BLOCK: v5 css is publisher-neutral, so every -->
<!-- WLN value that used to live hardcoded in the stylesheet is set here, on the title's own shell. -->
<!-- A second title copies this file and changes only the variable block. -->
<!-- Page chrome (navbar, masthead, footer) stays Webflow's — no masthead image here. -->
<div class="ix-nl">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jbrady74/inbxify-site-code@main/web-blocks-v6.css">
  <style>
    .ix-nl{
      /* WLN · Wyckoff Living NOW — title brand */
      --nl-font-display:'Fraunces',Georgia,serif;
      --nl-bar-bg:#f4a127;
      --nl-bar-ink:#142e2e;
      --nl-bar-font:'Playfair Display',Georgia,serif;
      --nl-bar-label-font:'Jost','DM Sans',Arial,sans-serif;
      --nl-signoff-border:#d4a04a;
      --nl-signoff-font:'Playfair Display',Georgia,serif;
      --nl-signoff-ink:#444444;
    }
  </style>
  <div class="nlw-issuebar">
    <span class="nlw-ib-side"><span class="nlw-ib-label">ISSUE</span><span class="nlw-ib-big">{{issueNo}}</span></span>
    <h1 class="nlw-ib-title">{{issueTitle}}</h1>
    <span class="nlw-ib-side nlw-ib-side--right"><span class="nlw-ib-label">{{publishDateShort}}</span><span class="nlw-ib-big">{{publishYear}}</span></span>
  </div>
  {{BLOCKS}}
  <div class="nlw-signoff"><p>Thanks for reading. See you next week!</p></div>
</div>

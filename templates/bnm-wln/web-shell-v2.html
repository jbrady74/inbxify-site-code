<!-- templates/bnm-wln/web-shell-v2.html · WS-I web shell v2 -->
<!-- v2 = v1 + issue bar (email shell section 1a port) + sign-off (section 24 port). -->
<!-- Page chrome (navbar, masthead, footer) stays Webflow's — no masthead image here. -->
<div class="ix-nl">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jbrady74/inbxify-site-code@main/web-blocks-v2.css">
  <div class="nlw-issuebar">
    <span class="nlw-ib-side"><span class="nlw-ib-label">ISSUE</span><span class="nlw-ib-big">{{issueNo}}</span></span>
    <h1 class="nlw-ib-title">{{issueTitle}}</h1>
    <span class="nlw-ib-side nlw-ib-side--right"><span class="nlw-ib-label">{{publishDateShort}}</span><span class="nlw-ib-big">{{publishYear}}</span></span>
  </div>
  {{BLOCKS}}
  <div class="nlw-signoff"><p>Thanks for reading. See you next week!</p></div>
</div>
